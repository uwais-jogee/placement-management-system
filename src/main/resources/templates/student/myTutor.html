<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tutor | PMS</title>
    <link rel="stylesheet" href="/css/main.css"/>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>
<body>
<div class="min-h-full">
    <!-- Nav Bar Fragment -->
    <div th:replace="fragments :: navStudent ('myTutor')"></div>

    <header class="bg-white shadow">
        <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">My Tutor</h1>
        </div>
    </header>

    <!-- Hidden data used by JS -->
    <div th:if="${onPlacement} or ${upcomingPlacement}" id="hiddenData"
         th:attr="data-student-username=${#authentication.principal.username}, data-student-first-name=${#authentication.principal.firstName}, data-student-last-name=${#authentication.principal.lastName}, data-tutor-username=${tutor.username}, data-tutor-first-name=${tutor.firstName}, data-tutor-last-name=${tutor.lastName}, data-placement-id=${placement.id}">
    </div>

    <main>
        <!-- Content -->
        <div th:if="${onPlacement} or ${upcomingPlacement}" class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 gap-x-12 gap-y-12 sm:grid-cols-2">
                <div class="col-span-1 sm:col-span-1">
                    <!-- Tutor Details Card -->
                    <div class="bg-white shadow rounded-lg">
                        <div class="px-4 py-5">
                            <h2 class="text-lg font-medium leading-6 text-gray-900">Tutor Details</h2>
                            <p class="mt-1 text-sm text-gray-500">Information about your designated tutor.</p>
                        </div>
                        <div class="border-t border-gray-200 px-4 py-5">
                            <div class="px-4 grid grid-cols-2 gap-x-2 gap-y-2 sm:grid-cols-2">
                                <div class="col-span-1">
                                    <label class="text-sm font-medium text-gray-500">Name</label>
                                    <p class="text-sm text-gray-800"
                                       th:text="${tutor.firstName + ' ' + tutor.lastName}"></p>
                                </div>
                                <div class="col-span-1">
                                    <label class="text-sm font-medium text-gray-500">Email</label>
                                    <p class="text-sm text-gray-800" th:text="${tutor.email}"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Placement Visits Card -->
                    <div class="bg-white shadow rounded-lg mt-12">
                        <div class="px-4 py-5">
                            <h2 class="text-lg font-medium leading-6 text-gray-900">Placement Visits</h2>
                            <p class="mt-1 text-sm text-gray-500">Track all your placement visits.</p>
                        </div>
                        <div class="border-t border-gray-200 px-4 py-4 space-y-4 overflow-x-auto">
                            <div th:each="visit : ${placement.visits}"
                                 class="border-b border-gray-200 pb-4 flex items-center justify-between">
                                <div class="flex items-center">
                                    <!-- Left: Status -->
                                    <span th:if="${visit.status.getFormattedStatus() == 'Upcoming'}"
                                          class="text-nowrap px-2 py-1 text-sm font-medium rounded-full bg-yellow-100 text-yellow-800"
                                          th:text="${visit.status.getFormattedStatus()}">
                                    </span>
                                    <span th:if="${visit.status.getFormattedStatus() == 'Completed'}"
                                          class="text-nowrap px-2 py-1 text-sm font-medium rounded-full bg-green-100 text-green-800"
                                          th:text="${visit.status.getFormattedStatus()}">
                                    </span>
                                    <span th:if="${visit.status.getFormattedStatus() == 'Cancelled'}"
                                          class="text-nowrap px-2 py-1 text-sm font-medium rounded-full bg-red-100 text-red-800"
                                          th:text="${visit.status.getFormattedStatus()}">
                                    </span>
                                    <!-- Middle: Date/Time and Location -->
                                    <div class="ml-6 sm:ml-16 flex-col space-y-1">
                                        <!-- Date -->
                                        <p class="text-gray-600 text-sm"
                                           th:text="${#temporals.format(visit.date, 'dd/MM/yy')}"></p>
                                        <!-- Time -->
                                        <p class="text-gray-600 text-sm"
                                           th:text="${#temporals.format(visit.startTime, 'HH:mm') + ' - ' + #temporals.format(visit.endTime, 'HH:mm')}"></p>
                                        <!-- Location -->
                                        <p class="text-gray-600 text-sm"
                                           th:text="${visit.isOnline() ? 'Online' : 'In Person'}"></p>
                                    </div>
                                </div>
                                <!-- Right: Calendar Icon -->
                                <div class="mr-4">
                                    <a th:if="${visit.status.getFormattedStatus() == 'Upcoming'}"
                                       th:href="@{'/student/tutor/visits/download-event?visitId=' + ${visit.id}}"
                                       title="Download Calendar Event">
                                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                             stroke-width="1.5" stroke="currentColor"
                                             class="w-6 h-6 text-teal-600 hover:text-teal-400">
                                            <path stroke-linecap="round" stroke-linejoin="round"
                                                  d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
                                        </svg>
                                    </a>
                                </div>
                            </div>

                            <!-- No Visits Message -->
                            <p th:if="${#lists.isEmpty(placement.visits)}" class="text-sm text-gray-500 text-center">
                                No placement visits found.
                            </p>
                        </div>
                    </div>


                </div>

                <!-- Messages Card -->
                <div class="bg-white shadow rounded-lg flex flex-col min-h-screen max-h-screen col-span-1 sm:col-span-1 row-span-2">
                    <div class="px-4 py-5 border-b border-gray-200">
                        <h2 class="text-lg font-medium leading-6 text-gray-900">Messages</h2>
                        <p class="mt-1 text-sm text-gray-500">Chat with your placement tutor here.</p>
                    </div>

                    <!-- Messages Area -->
                    <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50" id="messagesArea">
                        <div th:each="message : ${messages}">
                            <!-- Current User Messages -->
                            <div th:if="${message.sender.username == #authentication.principal.username}"
                                 class="ml-auto bg-teal-100 p-2 rounded-lg shadow-sm max-w-xs break-words">
                                <p class="text-sm font-medium text-gray-700"
                                   th:text="${message.sender.firstName + ' ' + message.sender.lastName}"></p>
                                <p class="text-sm text-gray-800" th:text="${message.content}"></p>
                                <p class="text-xs text-gray-500"
                                   th:text="${#temporals.format(message.dateTime, 'dd/MM/yy, HH:mm')}"></p>
                            </div>

                            <!-- Other User Messages -->
                            <div th:unless="${message.sender.username == #authentication.principal.username}"
                                 class="mr-auto bg-gray-100 p-2 rounded-lg shadow-sm max-w-xs break-words">
                                <p class="text-sm font-medium text-gray-700"
                                   th:text="${message.sender.firstName + ' ' + message.sender.lastName}"></p>
                                <p class="text-sm text-gray-800" th:text="${message.content}"></p>
                                <p class="text-xs text-gray-500"
                                   th:text="${#temporals.format(message.dateTime, 'dd/MM/yy, HH:mm')}"></p>
                            </div>
                        </div>
                    </div>

                    <!-- Input Section -->
                    <div class="border-t border-gray-200 p-4 bg-gray-200">
                        <form id="messageForm" class="flex space-x-4 items-center">
                            <label for="messageInput"></label>
                            <textarea rows="3"
                                      class="flex-1 p-2 border border-gray-300 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-teal-500"
                                      placeholder="Type your message..."
                                      id="messageInput"
                                      maxlength="255"></textarea>
                            <button type="button" id="messageSubmitButton"
                                    class="rounded-full bg-teal-600 p-3 text-white hover:bg-teal-500 flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke-width="1.5" stroke="currentColor" class="h-6 w-6">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="!${onPlacement} and !${upcomingPlacement}" class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
            <p class="text-base font-semibold leading-7 text-gray-900 flex justify-center text-center">You are currently
                not on a
                placement, therefore do not have an assigned tutor.</p>
        </div>
    </main>

</div>

<script src="/js/app.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="/js/student/myTutor.js" defer></script>

</body>
</html>
