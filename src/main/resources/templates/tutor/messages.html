<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en" class="h-full bg-gray-100">
<head>
    <meta charset="UTF-8" name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | PMS</title>
    <link rel="stylesheet" href="/css/main.css"/>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
</head>
<body>
<div class="min-h-full">
    <!-- Nav Bar Fragment -->
    <div th:replace="fragments :: navTutor ('messages')"></div>

    <header class="bg-white shadow">
        <div class="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
            <h1 class="text-3xl font-bold tracking-tight text-gray-900">Messages</h1>
        </div>
    </header>

    <!-- Hidden  Data used by JS -->
    <div id="hiddenData"
         th:attr="data-tutor-username=${#authentication.principal.username}, data-tutor-first-name=${#authentication.principal.firstName}, data-tutor-last-name=${#authentication.principal.lastName}">
    </div>

    <main>
        <!-- Content -->
        <div class="mx-auto max-w-7xl px-4 py-12 sm:px-6 lg:px-8">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-12 gap-y-12">
                <!-- Left Column: Students List -->
                <div class="col-span-1 space-y-6">
                    <!-- Students List Card -->
                    <div class="bg-white shadow rounded-lg">
                        <div class="px-4 py-5">
                            <h2 class="text-lg font-medium leading-6 text-gray-900">Students</h2>
                            <p class="mt-1 text-sm text-gray-500">Select a student to view their messages.</p>
                        </div>
                        <div class="border-t border-gray-200 px-4 py-5 space-y-4">
                            <!-- Loop through placements to list students -->
                            <div th:each="placement : ${placements}"
                                 class="placementMessageChats p-4 border rounded-lg cursor-pointer hover:bg-gray-100"
                                 th:attr="data-placement-id=${placement.id}, data-student-username=${placement.student.username}, data-student-first-name=${placement.student.firstName}, data-student-last-name=${placement.student.lastName}">
                                <p class="text-sm font-medium text-gray-800"
                                   th:text="${placement.student.firstName + ' ' + placement.student.lastName}"></p>
                                <p class="text-sm text-gray-500" th:text="${placement.company.companyName}"></p>
                            </div>

                            <!-- Placeholder if no students -->
                            <p th:if="${#lists.isEmpty(placements)}" class="text-sm text-gray-500">No students found.</p>
                        </div>
                    </div>
                </div>

                <!-- Right column: Messaging Card -->
                <div class="col-span-1 bg-white shadow rounded-lg flex flex-col min-h-screen max-h-screen">
                    <div class="px-4 py-5 border-b border-gray-200">
                        <h2 class="text-lg font-medium leading-6 text-gray-900">Messages</h2>
                        <p class="mt-1 text-sm text-gray-500">Chat with your placement students here.</p>
                    </div>

                    <!-- Messages Area -->
                    <div class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50" id="messagesArea">
                        <!-- Placeholder for messages -->
                        <div id="messagesPlaceholder" class="text-gray-500 text-center py-10">
                            Select a student to view their messages.
                        </div>
                    </div>

                    <!-- Input Section -->
                    <div class="border-t border-gray-200 p-4 bg-gray-200">
                        <form id="messageForm" class="flex space-x-4 items-center">
                            <label for="messageInput"></label>
                            <textarea rows="3"
                                      class="flex-1 p-2 border border-gray-300 rounded-lg resize-none focus:outline-none focus:ring-2 focus:ring-teal-500"
                                      placeholder="Type your message..."
                                      id="messageInput"
                                      maxlength="255"
                                      disabled></textarea>
                            <button type="button" id="messageSubmitButton" disabled
                                    class="rounded-full bg-teal-600 p-3 text-white hover:bg-teal-500 flex items-center justify-center disabled:bg-teal-600/50 disabled:text-white disabled:cursor-not-allowed">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                                     stroke-width="1.5" stroke="currentColor" class="h-6 w-6">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                          d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"/>
                                </svg>
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>

<script src="/js/app.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
<script src="/js/tutor/messages.js" defer></script>

</body>
</html>
